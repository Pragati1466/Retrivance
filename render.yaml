services:
  - type: web
    name: retrivance-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ragsentinel.api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: data
      mountPath: /app/data/ledger
      sizeGB: 1
